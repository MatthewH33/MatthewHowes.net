<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="edu/style.css">
</head>
<body>

  <header class="site-head">
    <div class="site-head__mark">GL</div>
    <div class="site-head__text">
      <h1>Grade Ledger</h1>
      <p>Semester tally &amp; projections — Term 2026</p>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Classes"></nav>

  <main id="classPanel" class="panel"></main>

  <template id="itemRowTemplate">
    <tr class="ledger-row">
      <td class="ledger-row__name"></td>
      <td class="ledger-row__weight"></td>
      <td class="ledger-row__score"></td>
      <td class="ledger-row__contrib"></td>
      <td class="ledger-row__actions"><button class="icon-btn del-btn" title="Remove entry">✕</button></td>
    </tr>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="edu/app.js"></script>
</body>
</html>
